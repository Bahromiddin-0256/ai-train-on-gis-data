std:  [0.0654, 0.0753, 0.0881, 0.0891, 0.1083, 0.1206, 0.1262, 0.1091, 0.1021, 0.0875, 0.0995, 0.0759, 0.0669, 0.1095, 0.0740, 0.0678, 0.0770, 0.0912, 0.0897, 0.1035, 0.1160, 0.1224, 0.1056, 0.0966, 0.1034, 0.1141, 0.0949, 0.0828, 0.0907, 0.0881, 0.0673, 0.0783, 0.0974, 0.0997, 0.1222, 0.1326, 0.1384, 0.1244, 0.1029, 0.0950, 0.1065, 0.0856, 0.0733, 0.0910, 0.0761, 0.0529, 0.0624, 0.0830, 0.0801, 0.0953, 0.1063, 0.1129, 0.0920, 0.0798, 0.0841, 0.1002, 0.0665, 0.0586, 0.0712, 0.0693, 0.0592, 0.0716, 0.0879, 0.0948, 0.1150, 0.1245, 0.1308, 0.1133, 0.0941, 0.0769, 0.0864, 0.0671, 0.0533, 0.0915, 0.0649, 0.0473, 0.0562, 0.0698, 0.0743, 0.0810, 0.0855, 0.0938, 0.0958, 0.0789, 0.0469, 0.0510, 0.0489, 0.0366, 0.0829, 0.0442]

# Image patch size fed to the model.
image_size: 64

# DataLoader settings.
batch_size: 256
num_workers: 8
pin_memory: true

# Train/val/test fractions (used when upstream data has no explicit split).
val_split: 0.15
test_split: 0.15

# Class labels (order is meaningful: index -> name).
# Derived from uzcosmos_flats crop_type values (compound labels normalised
# to primary crop by scripts/export_mongodb.py).
classes:
  - bugdoy
  - other
  - paxta
